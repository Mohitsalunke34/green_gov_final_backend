spring.application.name=SustainabilityProjectService
 
server.port = 1234
 
#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/sustainability_project_db?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}

spring.config.import=optional:configserver:http://localhost:8711

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true