spring.application.name=compliance-audit-service
server.port=6677


#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/compliance_audit_db?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}

# Optional Config Server
spring.config.import=optional:configserver:http://localhost:8711


# -------------------------------------------------------------------
# Eureka Client Configuration
# -------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true


# ===============================
# Resilience4j Circuit Breaker
# ===============================

resilience4j.circuitbreaker.instances.authService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.authService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.authService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authService.waitDurationInOpenState=20s

resilience4j.circuitbreaker.instances.participantService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.participantService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.subjectValidationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.subjectValidationService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50

# ===============================
# Retry for Notification only
# ===============================
resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=1s

# -------------------------------------------------------------------
# Actuator (Auth-service level)
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info