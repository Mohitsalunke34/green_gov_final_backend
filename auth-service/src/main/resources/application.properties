# -------------------------------------------------------------------
# Application basics
# -------------------------------------------------------------------
spring.application.name=auth-service
server.port=8044

#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}
# Optional Config Server
spring.config.import=optional:configserver:http://localhost:8711


# -------------------------------------------------------------------
# Eureka Client Configuration
# -------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

#Prevents restarts 
spring.devtools.restart.enabled=false

# -------------------------------------------------------------------
# JWT Configuration (MUST MATCH API-GATEWAY)
# -------------------------------------------------------------------
greengov.security.jwt.secret=hjsgfgfgfasdgaghsgdajgdhasgdahsfdahgsfdhgas

greengov.security.jwt.expiration-minutes=1008000 


# -------------------------------------------------------------------
# Actuator (Auth-service level)
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
