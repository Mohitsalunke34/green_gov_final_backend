spring.application.name=REPORTING-ANALYTICS-SERVICE


server.port=6333
#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/report_analytics_db?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}
# Optional Config Server
spring.config.import=optional:configserver:http://localhost:8711


# -------------------------------------------------------------------
# Eureka Client Configuration
# -------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true




# -------------------------------------------------------------------
# Actuator (Auth-service level)
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info


server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
