spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/resources/**,/api/infrastructure/**

# -------- NOTIFICATION SERVICE --------
spring.cloud.gateway.server.webmvc.routes[6].id=notification-service
