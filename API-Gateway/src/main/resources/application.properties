spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/notifications/**

# -------- COMPLIANCE AUDIT SERVICE --------
spring.cloud.gateway.server.webmvc.routes[7].id=compliance-audit-service
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://COMPLIANCE-AUDIT-SERVICE
