# -------------------------------------------------------------------
# Application basics
# -------------------------------------------------------------------
spring.application.name=API-GATEWAY
server.port=4444

spring.config.import=optional:configserver:http://localhost:8711

# -------------------------------------------------------------------
# Eureka Client Configuration
# -------------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
greengov.security.jwt.secret=hjsgfgfgfasdgaghsgdajgdhasgdahsfdahgsfdhgas

# -------------------------------------------------------------------
# Actuator
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,gateway

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.route=TRACE
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty.http.server=DEBUG
logging.level.org.springframework.cloud.client.discovery=DEBUG

# -------------------------------------------------------------------
# Spring Cloud Gateway Routes (WebMVC)
# -------------------------------------------------------------------

# -------- AUTH SERVICE --------
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/**,/api/users/**

# -------- PROFILE SERVICE --------
spring.cloud.gateway.server.webmvc.routes[1].id=profile-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://GREENGOV-PROFILE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/participants/**

# -------- SUSTAINABILITY PROJECT SERVICE --------
spring.cloud.gateway.server.webmvc.routes[2].id=sustainability-project-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://SUSTAINABILITYPROJECTSERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/projects/**

# -------- ENERGY PROGRAM SERVICE --------
spring.cloud.gateway.server.webmvc.routes[3].id=energy-program-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ENERGYPROGRAMSERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/programs/**,/api/applications/**

# -------- INCENTIVE SERVICE --------
spring.cloud.gateway.server.webmvc.routes[4].id=incentive-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://INCENTIVE-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/incentives/**,/api/disbursements/**

# -------- RESOURCE / INFRA SERVICE --------
spring.cloud.gateway.server.webmvc.routes[5].id=resource-infra-service
