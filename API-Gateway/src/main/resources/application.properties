# -------- REPORTING / ANALYTICS SERVICE --------
spring.cloud.gateway.server.webmvc.routes[8].id=reporting-analytics-service
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://REPORTING-ANALYTICS-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/reports/**

