spring.application.name=resource-infra-service
#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/resource_infra?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}


server.port=8082


spring.config.import=optional:configserver:http://localhost:8711
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true

spring.cloud.openfeign.circuitbreaker.enabled=true

# Optional: Configure Circuit Breaker properties
resilience4j.circuitbreaker.instances.NOTIFICATIONS-SERVICE.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.NOTIFICATIONS-SERVICE.slidingWindowSize=10