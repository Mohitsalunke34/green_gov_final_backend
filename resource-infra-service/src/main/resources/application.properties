spring.application.name=resource-infra-service
#spring.config.import=optional:configserver:http://localhost:8711
#spring.datasource.url=jdbc:mysql://localhost:3306/deptdb?createDatabaseIfNotExist=true
server.port=8082
#eureka.instance.prefer-ip-address=true 
#management.endpoints.web.exposure.include=prometheus,health,info
#management.endpoint.health.show-details=always

spring.config.import=optional:configserver:http://localhost:8711
spring.datasource.url=jdbc:mysql://localhost:3306/resource_infra_db?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true

spring.cloud.openfeign.circuitbreaker.enabled=true

# Optional: Configure Circuit Breaker properties
resilience4j.circuitbreaker.instances.NOTIFICATIONS-SERVICE.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.NOTIFICATIONS-SERVICE.slidingWindowSize=10