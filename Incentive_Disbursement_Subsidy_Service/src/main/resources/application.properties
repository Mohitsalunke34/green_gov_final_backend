spring.application.name=INCENTIVE-SERVICE


spring.datasource.url=jdbc:mysql://localhost:3306/incentive_disbursement_final?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}


server.port=7070

spring.config.import=optional:configserver:http://localhost:8711

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true



management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always



resilience4j.circuitbreaker.instances.programService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.programService.sliding-window-size=10
resilience4j.circuitbreaker.instances.programService.minimum-number-of-calls=6
resilience4j.circuitbreaker.instances.programService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.programService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.programService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.programService.record-exceptions=java.lang.Exception
resilience4j.circuitbreaker.instances.programService.slow-call-rate-threshold=50



