spring.application.name=INCENTIVE-SERVICE



#DB credentials
spring.datasource.url=jdbc:mysql://localhost:3306/incentive_disbursement_final?createDatabaseIfNotExist=true
spring.datasource.password=${DB_PASS}


server.port=7070

spring.config.import=optional:configserver:http://localhost:8711



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true